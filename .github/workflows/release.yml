name: Release

# 推送 v* tag 时触发：校验 → 构建 → 打包 → 创建 GitHub Release（附 tgz 产物）。
# 本项目只通过 GitHub Release 分发，不发布到 npm registry。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建（并校验 dist 与源码同步）
        run: |
          npm run build
          git diff --exit-code dist/ || {
            echo "::error::dist/ 与源码不一致：请本地 npm run build 后提交 dist 再打 tag"
            exit 1
          }

      - name: 打包 tarball
        run: npm pack

      - name: 创建 GitHub Release（附产物）
        uses: softprops/action-gh-release@v2
        with:
          files: daoyan-cli-*.tgz
          generate_release_notes: true
