name: Release

# 推送 v* tag 时触发：校验 → 构建 → 打包 → 创建 GitHub Release（附 tgz 产物）。
# 本项目只通过 GitHub Release 分发，不发布到 npm registry。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 代码格式检查（4 空格）
        run: npm run format:check

      - name: 类型检查
        run: npm run typecheck

      - name: 构建（并校验 dist 与源码同步）
        run: |
          npm run build
          git diff --exit-code dist/ || {
            echo "::error::dist/ 与源码不一致：请本地 npm run build 后提交 dist 再打 tag"
            exit 1
          }

      - name: 打包 tarball
        run: npm pack

      - name: 生成发布清单与校验和
        run: |
          tgz="$(ls daoyan-cli-*.tgz | head -n1)"
          sha="$(sha256sum "$tgz" | awk '{print $1}')"
          version="${GITHUB_REF_NAME#v}"
          node -e '
          const [tgz, sha, version, tag] = process.argv.slice(1);
          process.stdout.write(JSON.stringify({
            schema_version: 1,
            version,
            tag,
            tgz,
            sha256: sha,
            published_at: new Date().toISOString()
          }, null, 2) + "\n");
          ' "$tgz" "$sha" "$version" "$GITHUB_REF_NAME" > latest.json
          printf '%s  %s\n' "$sha" "$tgz" > SHA256SUMS
          cat latest.json

      - name: 创建 GitHub Release（附产物）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            daoyan-cli-*.tgz
            latest.json
            SHA256SUMS
          generate_release_notes: true
